# Local PostgreSQL only. User sandbox containers are created on demand by the
# Mastra process and must not be declared as long-running Compose services.
services:
  postgres:
    image: postgres:16
    container_name: nero-agent-postgres
    restart: unless-stopped
    env_file: .env.postgres
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - nero-agent-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nero_agent -d nero_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  nero-agent-postgres-data:
