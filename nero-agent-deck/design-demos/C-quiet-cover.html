<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>NERO AGENT — Direction C / Cover</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#f4f6f2}
  body{font-family:"Hiragino Sans GB","Heiti SC","Helvetica Neue",sans-serif;color:#0a2342}
  .slide{position:relative;width:1920px;height:1080px;overflow:hidden;background:
    radial-gradient(900px 700px at 82% 12%,rgba(28,76,255,.07),transparent 70%),
    linear-gradient(180deg,#f7f8f5 0%,#f1f4ef 100%)}
  .slide::before{content:"";position:absolute;width:920px;height:920px;border:1px solid rgba(10,35,66,.10);border-radius:50%;left:-260px;top:230px;pointer-events:none}
  .slide::after{content:"";position:absolute;width:1px;height:100%;left:72px;top:0;background:rgba(10,35,66,.10)}
  .top{position:absolute;left:72px;right:72px;top:46px;display:flex;justify-content:space-between;align-items:center;z-index:4}
  .brand{display:flex;align-items:center;gap:12px}
  .mark{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(145deg,#7c5cfc,#4e9bff);color:white;font:800 19px/1 "Avenir Next",sans-serif}
  .brandname{font:700 17px/1 "Avenir Next",sans-serif;letter-spacing:.16em}
  .brandname span{font-weight:500;color:#79847e}
  .meta{font:500 12px/1 "SF Mono",Menlo,monospace;color:#6c7a73;letter-spacing:.09em}
  .meta b{color:#1c4cff;font-weight:500}
  .title{position:absolute;left:154px;top:182px;width:820px;z-index:3}
  .eyebrow{font:500 14px/1 "SF Mono",Menlo,monospace;color:#1c4cff;letter-spacing:.12em;margin-bottom:34px}
  h1{margin:0;font-family:"Songti SC","STSong",serif;font-weight:600;font-size:120px;line-height:1.06;letter-spacing:-.055em;color:#0a2342}
  h1 em{font-style:normal;color:#1c4cff}
  .sub{margin:36px 0 0;width:660px;font-size:27px;line-height:1.85;color:#53635c;font-weight:300}
  .sub b{color:#0a2342;font-weight:500}
  .side{position:absolute;left:44px;top:604px;writing-mode:vertical-rl;font:500 11px/1 "SF Mono",Menlo,monospace;color:#88968f;letter-spacing:.16em}
  .visual{position:absolute;right:72px;top:158px;width:960px;height:660px;z-index:2}
  .frame{position:relative;width:960px;height:600px;padding:9px;background:#fff;border:1px solid rgba(10,35,66,.18);box-shadow:0 30px 80px rgba(10,35,66,.10)}
  .frame img{display:block;width:100%;height:100%;object-fit:cover;object-position:55% 0;filter:saturate(.7) contrast(1.01)}
  .frame::after{content:"";position:absolute;left:9px;right:9px;top:9px;height:28px;background:#fff;border-bottom:1px solid rgba(10,35,66,.08)}
  .caption{display:flex;justify-content:space-between;margin-top:15px;font:500 11px/1.5 "SF Mono",Menlo,monospace;color:#7f8d86;letter-spacing:.03em}
  .caption b{color:#1c4cff;font-weight:500}
  .bottom{position:absolute;left:154px;bottom:64px;display:flex;gap:38px;align-items:baseline;z-index:4}
  .bottom span{font:500 12px/1 "SF Mono",Menlo,monospace;color:#7f8d86;letter-spacing:.1em}
  .bottom b{font:500 13px/1 "SF Mono",Menlo,monospace;color:#0a2342;letter-spacing:.04em}
  .bottom i{display:block;width:1px;height:16px;background:rgba(10,35,66,.22)}
  .line{position:absolute;right:72px;bottom:64px;width:420px;height:1px;background:rgba(10,35,66,.2);z-index:3}
  .line::before{content:"";position:absolute;left:0;top:-3px;width:7px;height:7px;border-radius:50%;background:#1c4cff}
</style>
</head>
<body>
<main class="slide">
  <header class="top">
    <div class="brand"><div class="mark">N</div><div class="brandname">NERO <span>/ AGENT</span></div></div>
    <div class="meta"><b>SELF-HOSTED</b> / MASTRA / 2026</div>
  </header>

  <section class="title">
    <div class="eyebrow">一个会话，持续生长</div>
    <h1>让工作，<br>有地方<em>留下</em>。</h1>
    <p class="sub">工作区、记忆、技能与定时任务，<br>围绕同一次会话展开。<b>回来时，工作还在。</b></p>
  </section>

  <div class="side">NOT A MOMENT / A CONTINUING SURFACE</div>

  <section class="visual">
    <div class="frame"><img src="../assets/screenshots/real-skill-loaded.jpg" alt="nero-agent 会话界面"></div>
    <div class="caption"><span><b>图 01</b> / 会话内加载技能并继续工作</span><span>NERO AGENT / 实际界面</span></div>
  </section>

  <footer class="bottom"><span>会话</span><b>WORKBENCH</b><i></i><span>文件</span><b>WORKSPACE</b><i></i><span>调度</span><b>SCHEDULE</b></footer>
  <div class="line"></div>
</main>
</body>
</html>
