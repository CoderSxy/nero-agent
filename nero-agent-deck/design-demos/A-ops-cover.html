<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>NERO AGENT — Direction A / Cover</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #08090b; }
  body { font-family: "Hiragino Sans GB", "Heiti SC", "Helvetica Neue", sans-serif; color: #f4f6ef; }
  .slide {
    position: relative; width: 1920px; height: 1080px; overflow: hidden;
    background:
      radial-gradient(1100px 700px at 78% 23%, rgba(124,92,252,.13), transparent 62%),
      radial-gradient(900px 600px at 13% 92%, rgba(199,255,74,.06), transparent 60%),
      #08090b;
  }
  .slide::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .26;
    background-image: linear-gradient(rgba(255,255,255,.055) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.055) 1px, transparent 1px);
    background-size: 96px 96px;
    mask-image: linear-gradient(to bottom, black 0%, transparent 85%);
  }
  .slide::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .18;
    background-image: radial-gradient(rgba(255,255,255,.45) .7px, transparent .7px);
    background-size: 5px 5px;
  }
  .topbar { position: absolute; top: 54px; left: 72px; right: 72px; display: flex; align-items: center; justify-content: space-between; z-index: 4; }
  .brand { display: flex; align-items: center; gap: 13px; }
  .mark { width: 39px; height: 39px; border-radius: 10px; display: grid; place-items: center; background: linear-gradient(145deg,#8a65ff,#4e9bff); color: #fff; font: 800 21px/1 "Avenir Next", sans-serif; letter-spacing: -.04em; }
  .brand-name { font: 700 17px/1 "Avenir Next", sans-serif; letter-spacing: .18em; }
  .brand-name span { font-weight: 500; color: #8c9287; }
  .status { display: flex; align-items: center; gap: 11px; font: 500 13px/1 "SF Mono", Menlo, monospace; color: #8d9488; letter-spacing: .08em; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #c7ff4a; box-shadow: 0 0 18px rgba(199,255,74,.85); }
  .hero { position: absolute; left: 72px; top: 188px; width: 840px; z-index: 3; }
  .eyebrow { display: flex; align-items: center; gap: 13px; font: 500 15px/1 "SF Mono", Menlo, monospace; color: #b2b8aa; letter-spacing: .12em; margin-bottom: 36px; }
  .eyebrow::before { content: ""; width: 48px; height: 1px; background: #c7ff4a; }
  h1 { margin: 0; font-size: 104px; line-height: 1.03; font-weight: 650; letter-spacing: -.035em; }
  h1 em { font-style: normal; color: #c7ff4a; }
  .lede { margin: 42px 0 0; max-width: 700px; font-size: 27px; line-height: 1.75; color: #aab0a3; font-weight: 300; }
  .lede strong { color: #f4f6ef; font-weight: 500; }
  .capabilities { position: absolute; left: 72px; bottom: 54px; display: flex; gap: 0; border-top: 1px solid rgba(255,255,255,.16); padding-top: 18px; z-index: 4; }
  .cap { width: 215px; padding-right: 28px; }
  .cap + .cap { padding-left: 28px; border-left: 1px solid rgba(255,255,255,.11); }
  .cap b { display: block; font: 600 13px/1 "SF Mono", Menlo, monospace; color: #c7ff4a; letter-spacing: .09em; margin-bottom: 9px; }
  .cap span { font-size: 16px; color: #888f83; }
  .visual { position: absolute; right: 72px; top: 158px; width: 880px; z-index: 2; }
  .screen-frame { position: relative; width: 880px; height: 632px; padding: 12px; border: 1px solid rgba(199,255,74,.38); background: #0e100d; box-shadow: 0 38px 120px rgba(0,0,0,.55), 0 0 0 1px rgba(0,0,0,.5) inset; }
  .screen-frame::before { content: ""; position: absolute; left: 12px; right: 12px; top: 12px; height: 34px; background: #171914; border-bottom: 1px solid rgba(255,255,255,.09); z-index: 2; }
  .screen-frame::after { content: "NERO AGENT / LIVE SESSION"; position: absolute; top: 23px; left: 32px; z-index: 3; font: 500 10px/1 "SF Mono", Menlo, monospace; color: #7e8678; letter-spacing: .12em; }
  .screen-frame img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 9%; filter: saturate(.88) contrast(1.02); }
  .caption { display: flex; align-items: center; justify-content: space-between; margin-top: 17px; font: 500 13px/1.45 "SF Mono", Menlo, monospace; color: #77806f; letter-spacing: .02em; }
  .caption span:last-child { color: #c7ff4a; }
  .corner { position: absolute; width: 60px; height: 60px; border-color: #c7ff4a; border-style: solid; }
  .corner.tl { left: 34px; top: 34px; border-width: 1px 0 0 1px; }
  .corner.br { right: 34px; bottom: 34px; border-width: 0 1px 1px 0; }
  .note { position: absolute; right: 48px; top: 860px; width: 860px; display: flex; justify-content: space-between; color: #656d60; font: 500 12px/1.5 "SF Mono", Menlo, monospace; letter-spacing: .04em; z-index: 4; }
  .note b { color: #9aa18e; font-weight: 500; }
</style>
</head>
<body>
<main class="slide">
  <div class="corner tl"></div><div class="corner br"></div>
  <header class="topbar">
    <div class="brand"><div class="mark">N</div><div class="brand-name">NERO <span>/ AGENT</span></div></div>
    <div class="status"><span class="dot"></span>SELF-HOSTED · MASTRA 1.71 · 2026</div>
  </header>

  <section class="hero">
    <div class="eyebrow">持续工作的智能体平台</div>
    <h1>把一次对话，<br>变成<em>持续的工作</em>。</h1>
    <p class="lede">搜索、写入、记忆、调度，都留在同一个会话里。<br>不是问答结束就清空，而是一张<strong>会自己续写的工作台</strong>。</p>
  </section>

  <section class="visual">
    <div class="screen-frame"><img src="../assets/screenshots/real-skill-loaded.jpg" alt="nero-agent 会话界面，已加载技能"></div>
    <div class="caption"><span>图 01 / 会话内加载技能并执行</span><span>LIVE UI</span></div>
  </section>

  <div class="note"><span><b>TAVILY</b> 搜索 · <b>WORKSPACE</b> 文件 · <b>MEMORY</b> 记忆 · <b>CRON</b> 调度</span><span>一次登录，长期工作</span></div>

  <footer class="capabilities">
    <div class="cap"><b>SEARCH</b><span>网络搜索与网页读取</span></div>
    <div class="cap"><b>FILES</b><span>按用户与会话落盘</span></div>
    <div class="cap"><b>SCHEDULE</b><span>周期任务自动回来</span></div>
    <div class="cap"><b>SKILLS</b><span>把做法变成能力</span></div>
  </footer>
</main>
</body>
</html>
