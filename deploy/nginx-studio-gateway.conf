# Include inside the HTTPS server block for agent.nerosun.cn.
# The gate validates the existing admin session. The Studio key never reaches the browser.
location = /auth/studio-gate { return 404; }

location = /_studio_gate {
    internal;
    proxy_pass http://127.0.0.1:4111/auth/studio-gate;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /studio-api { return 301 /studio-api/; }

location ^~ /studio-api/ {
    auth_request /_studio_gate;
    auth_request_set $studio_proxy_authorization $upstream_http_x_studio_proxy_authorization;
    proxy_pass http://127.0.0.1:4111/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Mastra-Client-Type studio;
    proxy_set_header Authorization $studio_proxy_authorization;
    proxy_set_header Cookie "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}

location = /studio { return 301 /studio/; }

location ^~ /studio/ {
    auth_request /_studio_gate;
    proxy_pass http://127.0.0.1:4111;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}
