# Emergency starting budget for the current 2 GiB ECS. Install explicitly, do not enable automatically.
[Unit]
Requires=nero-runtime-workloads.slice nero-runtime-guard.timer
After=nero-runtime-workloads.slice nero-runtime-guard.timer
StartLimitIntervalSec=300
StartLimitBurst=2

[Service]
Slice=nero-runtime.slice
Environment="NERO_RESOURCE_GUARD_ENABLED=true"
Environment="SANDBOX_IDLE_STOP_MS=60000"
Environment="OBSERVABILITY_STORAGE=off"
Environment="SANDBOX_MAX_CONCURRENT=1"
Environment="NODE_OPTIONS=--max-old-space-size=256"
ExecStartPre=+/usr/bin/python3 /opt/nero-agent/current/mastra/ops/runtime-guard.py --preflight
ExecStartPre=/usr/local/bin/node --env-file=/opt/nero-agent/.env /opt/nero-agent/current/mastra/migrate.mjs --check
ExecStartPost=/usr/local/bin/node --env-file=/opt/nero-agent/.env /opt/nero-agent/current/mastra/ops/wait-ready.mjs
MemoryAccounting=yes
MemoryHigh=384M
MemoryMax=512M
MemorySwapMax=0
CPUAccounting=yes
CPUQuota=100%
TasksMax=256
IOAccounting=yes
IOReadBandwidthMax=/var/lib/nero-agent 10M
IOWriteBandwidthMax=/var/lib/nero-agent 10M
IOReadBandwidthMax=/data/mastra 10M
IOWriteBandwidthMax=/data/mastra 10M
OOMPolicy=stop
Restart=no
RestartSec=30
TimeoutStartSec=90
TimeoutStopSec=30
KillMode=control-group

ExecStopPost=+/usr/bin/systemctl --no-block start nero-runtime-guard.service
