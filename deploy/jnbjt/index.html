<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="江南百景图 AI 智能规划平台，正在筹备中。">
  <title>江南百景图 · 筹备中</title>
  <style>
    :root { color-scheme: light; background: #f5f1e8; color: #263e37; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; padding: 32px clamp(24px, 7vw, 112px); display: flex; flex-direction: column; }
    ::selection { color: #f5f1e8; background: #36584a; }
    header, footer { display: flex; justify-content: space-between; gap: 20px; align-items: center; font-size: 13px; color: #52645b; }
    header { padding-bottom: 24px; border-bottom: 1px solid #c9cebf; }
    main { flex: 1; width: min(100%, 900px); margin: auto; padding: clamp(64px, 12vh, 144px) 0; }
    h1 { margin: 0 0 28px; font-family: "Songti SC", "STSong", "SimSun", serif; font-size: clamp(42px, 8vw, 88px); font-weight: 500; letter-spacing: .08em; line-height: 1.35; text-wrap: balance; }
    .subtitle { font-size: clamp(18px, 3vw, 24px); margin: 0 0 56px; letter-spacing: .12em; }
    .status { display: inline-flex; align-items: center; gap: 10px; font-size: 15px; color: #8a4434; }
    .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .note { margin: 18px 0 0; line-height: 1.9; max-width: 40ch; font-size: 15px; color: #52645b; }
    footer { border-top: 1px solid #c9cebf; padding-top: 24px; line-height: 1.7; }
    footer p { margin: 0; }
    @media (max-width: 540px) { body { padding: 24px; } header { align-items: flex-start; } header span:last-child { display: none; } footer { flex-direction: column; align-items: flex-start; gap: 8px; } }
  </style>
</head>
<body>
  <header><span>江南百景图 · AI 智能规划平台</span><span>jnbjt.nerosun.cn</span></header>
  <main>
    <h1>江南百景图</h1>
    <p class="subtitle">一城烟火，慢慢规划。</p>
    <div class="status">正在筹备中</div>
    <p class="note">这里将成为你的江南规划小天地。<br>功能尚在准备，敬请期待。</p>
  </main>
  <footer><p>nerosun.cn</p><p>玩家自建规划工具，与游戏官方无关联。</p></footer>
</body>
</html>
